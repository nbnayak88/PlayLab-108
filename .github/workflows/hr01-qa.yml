name: HR01 gameplay static QA
on:
  push:
    branches: [main]
    paths:
      - 'qa/**'
      - 'engines/**'
      - 'content-packs/hr01/**'
      - 'standards/game-registry.json'
      - 'app.js'
      - 'index.html'
      - '.github/workflows/hr01-qa.yml'
  workflow_dispatch:
jobs:
  hr01-batch-01:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run HR01 Batch 01 static regression tests
        run: node qa/hr01-batch-01.test.cjs
      - name: Run HR01 crossword model regression tests
        run: node qa/hr01-crossword.test.cjs
      - name: Upload static QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hr01-batch-01-static-report
          path: qa/reports/hr01-batch-01.json
          if-no-files-found: warn
